<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100e0c" media="(prefers-color-scheme: dark)">
<title>dinecue</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg width='1024' height='1024' viewBox='0 0 1024 1024' fill='none' xmlns='http://www.w3.org/2000/svg' role='img' aria-labelledby='title desc'%3E  %3Ctitle id='title'%3EDineCue transparent icon%3C/title%3E  %3Cdesc id='desc'%3EA minimalist DineCue fork icon with an open circular dining cue mark on a transparent background.%3C/desc%3E  %3C%21-- Transparent background intentionally omitted --%3E  %3Cpath d='M310 684 A268 268 0 1 1 714 684'        stroke='#F5B84C'        stroke-width='92'        stroke-linecap='round'/%3E  %3Cg fill='#F5B84C'%3E    %3C%21-- fork tines --%3E    %3Crect x='430' y='292' width='44' height='210' rx='22'/%3E    %3Crect x='500' y='292' width='44' height='210' rx='22'/%3E    %3Crect x='570' y='292' width='44' height='210' rx='22'/%3E    %3C%21-- fork shoulders/bowl --%3E    %3Cpath d='M430 452             C430 544 466 602 512 602             C558 602 594 544 594 452             H614             C614 572 562 650 512 650             C462 650 410 572 410 452             H430Z'/%3E    %3C%21-- fork handle --%3E    %3Cpath d='M486 600             C486 586 497 575 512 575             C527 575 538 586 538 600             V790             C538 815 526 835 512 835             C498 835 486 815 486 790             V600Z'/%3E  %3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f3ea;
    --glow: rgba(212, 138, 69, 0.14);
    --ink: #1a1613;
    --muted: #5b5248;
    --accent: #c27a2c;
    --line: #d48a45;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #100e0c;
      --glow: rgba(212, 138, 69, 0.16);
      --ink: #f4efe4;
      --muted: #bdb3a3;
      --accent: #f0b35c;
      --line: #f0b35c;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 16px;
    background: radial-gradient(ellipse 80% 50% at 50% 0%, var(--glow), transparent 70%), var(--bg);
    color: var(--ink);
    font: 400 1.0625rem/1.65 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-wrap: break-word;
  }
  main { width: 100%; max-width: 32rem; }
  h1 {
    margin: 0 0 10px;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: clamp(2.5rem, 2rem + 2.5vw, 3.5rem);
    line-height: 1;
    letter-spacing: -0.03em;
  }
  h1 span { color: var(--accent); }
  p.tagline {
    margin: 0 0 28px;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 1.25rem;
    color: var(--muted);
  }
  p { margin: 0 0 16px; }
  p.lead { font-size: 1.1875rem; }
  p.muted { color: var(--muted); margin-top: 28px; }
  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--line);
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
  }
  a:hover { text-decoration-thickness: 3px; }
  a:focus-visible { outline: 2px solid var(--line); outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <h1>dinecue<span aria-hidden="true">.</span></h1>
  <p class="tagline">Eat by mood.</p>
  <p class="lead">dinecue was a dining assistant that helped people decide where to eat by mood, location and preferences.</p>
  <p>It has been terminated because other projects keep me busy and I will not be supporting it any further.</p>
  <p class="muted">The source code for the <a href="https://github.com/buraltintas/dinecue-ui">web app</a> and the <a href="https://github.com/buraltintas/dinecue-api">API</a> is on GitHub.</p>
</main>
</body>
</html>
